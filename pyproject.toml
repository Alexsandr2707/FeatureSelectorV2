[project]
name = "feature-selector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bnlearn>=1.0.0",
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
]

[project.scripts]
feature-selector = "feature_selector:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
